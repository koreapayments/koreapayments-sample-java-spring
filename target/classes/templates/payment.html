<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KPN FirstPay 결제 샘플 (Spring Boot)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Malgun Gothic', '맑은 고딕', Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 24px;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .info-section {
            margin-bottom: 30px;
        }

        .info-title {
            font-size: 16px;
            font-weight: bold;
            color: #555;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #007bff;
        }

        .info-row {
            display: flex;
            margin-bottom: 12px;
            padding: 8px;
            background-color: #f9f9f9;
            border-radius: 4px;
        }

        .info-label {
            flex: 0 0 120px;
            font-weight: bold;
            color: #666;
        }

        .info-value {
            flex: 1;
            color: #333;
        }

        .button-container {
            text-align: center;
            margin-top: 30px;
        }

        .pay-button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .pay-button:hover {
            background-color: #0056b3;
        }

        .pay-button:active {
            transform: translateY(1px);
        }

        .note {
            margin-top: 20px;
            padding: 15px;
            background-color: #e7f3ff;
            border-left: 4px solid #007bff;
            border-radius: 4px;
            font-size: 14px;
            color: #004085;
        }

        .note strong {
            display: block;
            margin-bottom: 5px;
        }

        .badge {
            display: inline-block;
            padding: 3px 8px;
            background-color: #28a745;
            color: white;
            border-radius: 3px;
            font-size: 12px;
            margin-left: 5px;
        }

        /* 로딩 오버레이 */
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }

        .loading-overlay.active {
            display: flex;
        }

        .loading-content {
            background: white;
            padding: 40px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #007bff;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-message {
            color: #333;
            font-size: 16px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>KPN FirstPay 결제 샘플</h1>

        <div class="info-section">
            <div class="info-title">가맹점 정보</div>
            <div class="info-row">
                <div class="info-label">가맹점 ID</div>
                <div class="info-value" th:text="${mxId}"></div>
            </div>
            <div class="info-row">
                <div class="info-label">주문번호</div>
                <div class="info-value" th:text="${mxIssueNo}"></div>
            </div>
            <div class="info-row">
                <div class="info-label">주문일시</div>
                <div class="info-value" th:text="${mxIssueDate}"></div>
            </div>
        </div>

        <div class="info-section">
            <div class="info-title">결제 정보</div>
            <div class="info-row">
                <div class="info-label">상품명</div>
                <div class="info-value" th:text="${orderName}"></div>
            </div>
            <div class="info-row">
                <div class="info-label">결제금액</div>
                <div class="info-value" th:text="${#numbers.formatInteger(amount, 1, 'COMMA')} + ' 원'"></div>
            </div>
        </div>

        <div class="info-section">
            <div class="info-title">주문자 정보</div>
            <div class="info-row">
                <div class="info-label">주문자명</div>
                <div class="info-value" th:text="${custName}"></div>
            </div>
            <div class="info-row">
                <div class="info-label">이메일</div>
                <div class="info-value" th:text="${email}"></div>
            </div>
            <div class="info-row">
                <div class="info-label">휴대폰번호</div>
                <div class="info-value" th:text="${phoneNo}"></div>
            </div>
        </div>

        <div class="button-container">
            <button id="payBtn" class="pay-button">결제하기</button>
        </div>

        <div class="note">
            <strong>Spring Boot 샘플 코드</strong>
            이 페이지는 Spring Boot + Thymeleaf로 구현된 결제 연동 샘플입니다.<br>
            실제 운영 환경 적용 시 application.yml의 설정을 변경하세요.
        </div>
    </div>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-content">
            <div class="spinner"></div>
            <div class="loading-message">결제 승인 처리 중입니다...</div>
        </div>
    </div>

    <form id="approvalForm" action="/payment/approve" method="post" style="display: none;">
        <input type="hidden" name="mxId" id="approvalMxId">
        <input type="hidden" name="mxIssueNo" id="approvalMxIssueNo">
        <input type="hidden" name="mxIssueDate" id="approvalMxIssueDate">
        <input type="hidden" name="amount" id="approvalAmount">
        <input type="hidden" name="fdTid" id="approvalFdTid">
        <input type="hidden" name="approvalUrl" id="approvalUrl">
    </form>

    <script th:src="${sdkUrl}"></script>

    <script th:inline="javascript">
        /*<![CDATA[*/
        window.addEventListener("message", function(event) {
            if (event.origin !== window.location.origin) {
                console.warn("유효하지 않은 origin에서 메시지 수신:", event.origin);
                return;
            }

            if (event.data && event.data.type === "PAYMENT_AUTH_RESULT") {
                var authData = event.data.data;
                console.log("인증 결과 수신:", authData);

                if (authData.code === "0000") {
                    console.log("인증 성공. 승인 요청 시작...");

                    document.getElementById("loadingOverlay").classList.add("active");

                    document.getElementById("approvalMxId").value = authData.mxId;
                    document.getElementById("approvalMxIssueNo").value = authData.mxIssueNo;
                    document.getElementById("approvalMxIssueDate").value = authData.mxIssueDate;
                    document.getElementById("approvalAmount").value = authData.amount;
                    document.getElementById("approvalFdTid").value = authData.fdTid;
                    document.getElementById("approvalUrl").value = authData.approvalUrl;

                    document.getElementById("approvalForm").submit();
                } else {
                    var errorMessage = authData.message || "알 수 없는 오류";
                    alert("결제 인증 실패\n\n코드: " + authData.code + "\n메시지: " + errorMessage);
                    console.error("인증 실패:", authData);
                }
            }
        });

        document.getElementById("payBtn").addEventListener("click", function() {
            // FirstPay SDK 객체 생성
            var pay = new FirstPay({
                env: /*[[${env}]]*/ "develop",
                openType: /*[[${openType}]]*/ "popup",
                closeWindowOnly: false,
                onFailure: function(error) {
                    console.error("[" + error.code + "] " + error.message);
                    alert("결제 요청 실패: " + error.message);
                }
            });

            pay.goPay({
                mxId: /*[[${mxId}]]*/ "",
                mxIssueNo: /*[[${mxIssueNo}]]*/ "",
                mxIssueDate: /*[[${mxIssueDate}]]*/ "",
                orderName: /*[[${orderName}]]*/ "",
                amount: /*[[${amount}]]*/ 0,
                returnUrl: window.location.origin + "/payment/auth-callback",
                callHash: /*[[${callHash}]]*/ "",

                custName: /*[[${custName}]]*/ "",
                email: /*[[${email}]]*/ "",
                phoneNo: /*[[${phoneNo}]]*/ "",
                lang: /*[[${lang}]]*/ "ko",

                payMethodView: true,
                simplepayView: true,
                emailView: true,
                escrowView: true
            });
        });
        /*]]>*/
    </script>
</body>
</html>
