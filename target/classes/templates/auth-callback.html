<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>결제 인증 처리 중...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Malgun Gothic', '맑은 고딕', Arial, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .loading-container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #007bff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .message {
            color: #28a745;
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="loading-container">
        <div class="spinner"></div>
        <div class="message">인증 완료! 승인 처리를 진행합니다...</div>
    </div>

    <script th:inline="javascript">
        /*<![CDATA[*/
        (function() {
            var authData = {
                mxId: /*[[${mxId}]]*/ "",
                mxIssueNo: /*[[${mxIssueNo}]]*/ "",
                mxIssueDate: /*[[${mxIssueDate}]]*/ "",
                amount: /*[[${amount}]]*/ "",
                code: /*[[${code}]]*/ "",
                message: /*[[${message}]]*/ "",
                fdTid: /*[[${fdTid}]]*/ "",
                approvalUrl: /*[[${approvalUrl}]]*/ ""
            };

            console.log("인증 결과:", authData);

            if (window.opener && !window.opener.closed) {
                window.opener.postMessage({
                    type: 'PAYMENT_AUTH_RESULT',
                    data: authData
                }, window.location.origin);

                console.log("부모 창으로 인증 결과 전달 완료");

                setTimeout(function() {
                    window.close();
                }, 100);
            } else {
                document.querySelector('.message').textContent =
                    '오류: 부모 창을 찾을 수 없습니다. 이 창을 닫고 다시 시도해주세요.';
                document.querySelector('.spinner').style.display = 'none';
            }
        })();
        /*]]>*/
    </script>
</body>
</html>
