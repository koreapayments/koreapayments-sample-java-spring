spring:
  application:
    name: firstpay-sample-springboot

  thymeleaf:
    cache: false
    encoding: UTF-8
    mode: HTML
    prefix: classpath:/templates/
    suffix: .html

  output:
    ansi:
      enabled: always

server:
  port: 8080
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true

firstpay:
  mx-id: testcorp
  pass-key: ${FIRSTPAY_PASS_KEY:}   # 환경변수로만 설정 (코드·파일에 직접 쓰지 않음). 없으면 시작 실패
  env: develop
  dev-url: https://dev.firstpay.co.kr
  prod-url: https://pay.firstpay.co.kr
  sdk-js-url: /js/firstpay_v2.js
  open-type: popup
  lang: ko

logging:
  level:
    root: INFO
    kr.co.kpn.firstpay: DEBUG   # 응답 전문은 DEBUG 로만 출력. 운영(prod)은 INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

---
spring:
  config:
    activate:
      on-profile: dev

firstpay:
  env: develop
  mx-id: testcorp

logging:
  level:
    kr.co.kpn.firstpay: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod
  thymeleaf:
    cache: true

firstpay:
  env: product
  mx-id: your_production_merchant_id
  pass-key: ${FIRSTPAY_PASS_KEY:}   # 환경변수로만 설정 (코드·파일에 직접 쓰지 않음). 없으면 시작 실패

logging:
  level:
    root: WARN
    kr.co.kpn.firstpay: INFO
